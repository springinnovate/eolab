name: Application build inputs

on:
  pull_request:
    paths:
      - Dockerfile.app
      - pyproject.toml
      - deployment/application-*
      - .github/workflows/application-build-inputs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build twice without layer or pip caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/application-builds
          revision=$(git rev-parse HEAD)
          for attempt in 1 2; do
            docker build --pull --no-cache --platform linux/amd64 \
              --build-arg SOURCE_COMMIT="$revision" \
              -f Dockerfile.app -t "eolab-build-inputs:$attempt" . \
              2>&1 | tee "artifacts/application-builds/build-$attempt.log"
            docker run --rm --network none --entrypoint cat \
              "eolab-build-inputs:$attempt" /app/build-environment.json \
              > "artifacts/application-builds/environment-$attempt.json"
            docker image inspect "eolab-build-inputs:$attempt" \
              > "artifacts/application-builds/image-$attempt.json"
          done
          diff -u artifacts/application-builds/environment-{1,2}.json
      - name: Frontend tests in the recorded Node build stage
        run: |
          docker build --target frontend-builder -f Dockerfile.app -t eolab-build-inputs:frontend .
          docker run --rm --network none eolab-build-inputs:frontend npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-build-inputs-${{ github.run_id }}
          path: artifacts/application-builds/
