[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eolab-catalog"
version = "0.1.0"
description = "Immutable STAC catalog service for EOLab data assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
