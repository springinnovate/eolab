[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eolab"
version = "0.9.0"
description = "Earth observation analysis and visualization."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "nhi-terrestrial-integrity-modeling @ https://codeload.github.com/springinnovate/nhi-terrestrial-integrity-modeling/tar.gz/35555aa15d86c3da928742358d9280f23fbc6ca3#sha256=50fe72e925e335bec8090d0ee7a2c2cb67955b602cb4222783a470387490f647",
    "earthengine-api==1.7.50",
    "wwf-es-beneficiaries==0.0.0+ga4022421baa2",
    "ecoshard @ https://github.com/springinnovate/ecoshard/archive/6bd106862a2cb2517f91f9bd7ca8bb071ccb6013.tar.gz#sha256=e751808a1dc57dfc2236e96f41209ed82dfa85ee492d146da339a8249a001f3b",
    "pyflwdir==0.6.0+eolab.2",
    "scipy>=1.14,<2",
    "numexpr>=2.10,<3",
    "psutil>=7,<8",
    "retrying>=1.3,<2",
    "Rtree>=1.4,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "fiona>=1.10,<2",
    "gdal[numpy]>=3.10,<3.11",
    "httpx2>=2.9,<3",
    "ijson>=3.5,<4",
    "numpy>=1.26,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.3.3,<4",
    "pyproj>=3.7,<4",
    "PyYAML==6.0.3",
    "rasterio>=1.5,<2",
    "shapely>=2.1,<3",
    "tifffile==2026.3.3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest>=8,<9",
]

[tool.black]
required-version = "26.5.1"
target-version = ["py312"]
line-length = 88

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eolab_app = ["static/*", "static/**/*", "processing/recipes/*.yaml", "annotation_sessions/*.sql", "annotation_sessions/admin.*", "saved_maps/*.sql", "planning/*.sql", "drawings/*.sql"]
eolab_jobs = ["schema.sql", "schema_check.sql", "schema_23.sql", "schema_24.sql"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "services/jobs"]
testpaths = ["tests"]
