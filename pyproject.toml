[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eolab"
version = "0.9.0"
description = "Earth observation analysis and visualization."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "ecoshard @ https://github.com/springinnovate/ecoshard/archive/f7e2adba2a4d41128aea941bb747470418d2dce9.tar.gz#sha256=a2439488aec725acf3ff69a4ce491643212a604cf0e47c13b61077fb09cfdb40",
    "scipy>=1.14,<2",
    "numexpr>=2.10,<3",
    "psutil>=7,<8",
    "retrying>=1.3,<2",
    "Rtree>=1.4,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "fiona>=1.10,<2",
    "gdal[numpy]>=3.10,<3.11",
    "httpx2>=2.9,<3",
    "ijson>=3.5,<4",
    "numpy>=1.26,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.3.3,<4",
    "pyproj>=3.7,<4",
    "PyYAML==6.0.3",
    "rasterio>=1.5,<2",
    "shapely>=2.1,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest>=8,<9",
]

[tool.black]
required-version = "26.5.1"
target-version = ["py312"]
line-length = 88

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eolab_app = ["static/*", "static/**/*", "processing/*.sql", "processing/recipes/*.yaml", "annotation_sessions/*.sql", "annotation_sessions/admin.*", "saved_maps/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "services/jobs"]
testpaths = ["tests"]
