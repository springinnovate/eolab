schema: eolab.model/v1
id: vector-summary
version: "2.0.0"
title: Group polygons and calculate field statistics
description: >-
  Group polygons by a field, merge each group's boundaries, and calculate statistics for selected numeric fields.
  Produces one GeoPackage feature per group. Each feature's valid field value has equal weight; missing values are excluded.
  Boundary simplification changes outlines only; use 0 to keep detailed merged boundaries.
inputs:
  vector:
    type: vector
    label: Polygon layer
    geometry: polygon
    fields:
      group:
        label: Group by field
        kind: scalar
    rows:
      label: Field statistics
      itemLabel: Field statistic
      fields:
        value:
          label: Numeric field
          kind: numeric
      parameters:
        statistic:
          type: choice
          label: Statistic
          choices:
            - {value: sum, label: Sum}
            - {value: mean, label: Mean}
            - {value: max, label: Maximum}
            - {value: min, label: Minimum}
            - {value: stdev, label: Population standard deviation}
          default: sum
parameters:
  boundary_tolerance_m:
    type: number
    label: Boundary simplification
    unit: approx. m
    minimum: 0
    default: 1000
steps:
  - id: calculate
    operation: vector.summary.v1
    inputs:
      vector: {input: vector}
    parameters:
      boundary_tolerance_m: {parameter: boundary_tolerance_m}
outputs:
  summary:
    label: Grouped polygons with field statistics
    source: calculate.summary
    role: result
    presentation: map
    saveEligible: true
executionProfile: vector-summary
