schema: eolab.model/v1
id: vector-summary
version: "1.1.0"
title: Vector summary
description: >-
  Summarize a numeric field for each distinct group and merge its polygons into an overview layer.
  Boundary detail changes outlines only; use 0 to retain detailed merged boundaries.
  Missing values are excluded. Standard deviation describes the whole group (population);
  one valid value has zero deviation, and a group with no valid values has a missing result.
inputs:
  vector:
    type: vector
    label: Polygon layer
    geometry: polygon
    fields:
      group:
        label: Group by
        kind: scalar
      value:
        label: Field to summarize
        kind: numeric
parameters:
  statistic:
    type: choice
    label: Statistic
    choices:
      - {value: sum, label: Sum}
      - {value: mean, label: Mean}
      - {value: max, label: Maximum}
      - {value: min, label: Minimum}
      - {value: stdev, label: Standard deviation}
    default: sum
  boundary_tolerance_m:
    type: number
    label: Boundary detail
    unit: approximate metres
    minimum: 0
    default: 1000
steps:
  - id: calculate
    operation: vector.summary.v1
    inputs:
      vector: {input: vector}
    parameters:
      statistic: {parameter: statistic}
      boundary_tolerance_m: {parameter: boundary_tolerance_m}
outputs:
  summary:
    source: calculate.summary
    role: result
    presentation: map
    saveEligible: true
executionProfile: vector-summary
