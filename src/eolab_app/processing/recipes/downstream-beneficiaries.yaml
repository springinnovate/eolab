schema: eolab.model/v1
id: downstream-beneficiaries
version: "4.0.0"
title: Downstream ecosystem beneficiaries
description: >-
  Run the original WWF downstream model from one combined starting mask.
  The model uses the calculation pixel size and metres-per-pixel setting below,
  resamples values onto its coverage grid, and includes positive values.
  Sum reports the original model total; other formulas summarize its masked output.
inputs:
  starting_mask:
    type: mask_source
    label: Starting mask
  values:
    type: raster
    label: Values to summarize
parameters:
  wgs84_pixel_size:
    type: number
    label: Calculation pixel size
    unit: degrees
    exclusiveMinimum: 0
    default: 0.008333333333333
  travel_time_pixel_size_m:
    type: number
    label: Pixel size used for distances
    unit: m
    exclusiveMinimum: 0
    default: 900
  buffer_m:
    type: number
    label: Buffer radius
    unit: m
    minimum: 0
    default: 5000
  cutoff_m:
    type: optional_number
    label: Maximum straight-line distance
    unit: m
    exclusiveMinimum: 0
    default: null
  summary:
    type: summary_expression
    label: Summary formula
    alias: a
    grammar: eolab.scalar/v1
    default: "sum(a)"
steps:
  - id: analysis
    operation: hydrology.downstream_beneficiaries.v1
    inputs:
      starting_mask: {input: starting_mask}
      hydrology:
        value:
          dem:
            collectionId: eolab-mounted-geotiffs
            itemId: geotiff-ee81a7caa68b3a9a23c7540a
          watersheds:
            collectionId: eolab-mounted-vectors
            itemId: geopackage-86eb43d6b974d6a05d8cc30d
          topology:
            idField: HYBAS_ID
            downstreamField: NEXT_DOWN
            idType: integer
            terminal:
              field: NEXT_SINK
              equalsField: HYBAS_ID
            terminalIdField: NEXT_SINK
      values: {input: values}
      settings:
        value:
          # EcoShard search steps per pit; -1 and 0 allow unlimited searches.
          pit_fill_search_limit: 1000
    parameters:
      buffer_m: {parameter: buffer_m}
      cutoff_m: {parameter: cutoff_m}
      summary: {parameter: summary}
      wgs84_pixel_size: {parameter: wgs84_pixel_size}
      travel_time_pixel_size_m: {parameter: travel_time_pixel_size_m}
outputs:
  masked_values:
    source: analysis.masked_values
    role: result
    presentation: map
    saveEligible: true
  coverage:
    source: analysis.coverage
    role: result
    presentation: map
    saveEligible: true
  statistics:
    source: analysis.statistics
    role: result
    presentation: table
    saveEligible: true
  starting_mask:
    source: analysis.starting_mask
    role: intermediate
    presentation: map
    saveEligible: false
  routing_dem:
    source: analysis.routing_dem
    role: intermediate
    presentation: map
    saveEligible: false
executionProfile: downstream-small-region
