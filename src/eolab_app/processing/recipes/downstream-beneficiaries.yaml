schema: eolab.model/v1
id: downstream-beneficiaries
version: "4.0.0"
title: Map downstream areas and summarize raster values
description: >-
  Use the WWF model to trace and buffer downstream flow from a starting area,
  then calculate a statistic from positive raster values within the resulting area, such as a population total.
  Values are resampled to the output grid using nearest neighbor.
  Distance conversion supplies metres per cell for the buffer and straight-line cutoff.
inputs:
  starting_mask:
    type: mask_source
    label: Flow starting area
  values:
    type: raster
    label: Raster values to summarize
parameters:
  wgs84_pixel_size:
    type: number
    label: Routing and output cell size
    unit: degrees
    exclusiveMinimum: 0
    default: 0.008333333333333
  travel_time_pixel_size_m:
    type: number
    label: Distance conversion
    unit: m per cell
    exclusiveMinimum: 0
    default: 900
  buffer_m:
    type: number
    label: Buffer radius around downstream flow paths
    unit: m
    minimum: 0
    default: 5000
  cutoff_m:
    type: optional_number
    label: Maximum straight-line distance from a starting cell
    unit: m
    exclusiveMinimum: 0
    default: null
  summary:
    type: summary_expression
    label: Statistic formula
    alias: a
    grammar: eolab.scalar/v1
    default: "sum(a)"
steps:
  - id: analysis
    operation: hydrology.downstream_beneficiaries.v1
    inputs:
      starting_mask: {input: starting_mask}
      hydrology:
        value:
          dem:
            collectionId: eolab-mounted-geotiffs
            itemId: geotiff-ee81a7caa68b3a9a23c7540a
          watersheds:
            collectionId: eolab-mounted-vectors
            itemId: geopackage-86eb43d6b974d6a05d8cc30d
          topology:
            idField: HYBAS_ID
            downstreamField: NEXT_DOWN
            idType: integer
            terminal:
              field: NEXT_SINK
              equalsField: HYBAS_ID
            terminalIdField: NEXT_SINK
      values: {input: values}
      settings:
        value:
          # EcoShard search steps per pit; -1 and 0 allow unlimited searches.
          pit_fill_search_limit: 1000
    parameters:
      buffer_m: {parameter: buffer_m}
      cutoff_m: {parameter: cutoff_m}
      summary: {parameter: summary}
      wgs84_pixel_size: {parameter: wgs84_pixel_size}
      travel_time_pixel_size_m: {parameter: travel_time_pixel_size_m}
outputs:
  masked_values:
    label: Positive raster values within the downstream area
    source: analysis.masked_values
    role: result
    presentation: map
    saveEligible: true
  coverage:
    label: Downstream area including the buffer
    source: analysis.coverage
    role: result
    presentation: map
    saveEligible: true
  statistics:
    label: Raster statistic for the downstream area
    source: analysis.statistics
    role: result
    presentation: table
    saveEligible: true
  starting_mask:
    label: Flow starting area
    source: analysis.starting_mask
    role: intermediate
    presentation: map
    saveEligible: false
  routing_dem:
    source: analysis.routing_dem
    role: intermediate
    presentation: map
    saveEligible: false
executionProfile: downstream-small-region
