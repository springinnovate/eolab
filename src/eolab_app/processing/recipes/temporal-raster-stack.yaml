schema: eolab.model/v1
id: temporal-raster-stack
version: "1.0.0"
title: Raster statistics over time
description: Calculate the chosen raster formulas for each observation of one variable in a time period. Compare area statistics or the value at a clicked pixel across time. Produces a CSV of values and valid pixel counts.
inputs:
  source:
    type: temporal_interval
    label: Dataset and period
  area:
    type: summary_area
    label: Analysis area
  metrics:
    type: temporal_stack_metrics
    label: Statistics and clicked point
parameters: {}
steps:
  - id: calculate
    operation: temporal.stack.v1
    inputs:
      source: {input: source}
      area: {input: area}
      metrics: {input: metrics}
    parameters: {}
outputs:
  series:
    type: timeSeries
    label: Raster statistics by observation (CSV)
    source: calculate.series
    role: result
    presentation: download
    saveEligible: false
executionProfile: temporal-area-series
