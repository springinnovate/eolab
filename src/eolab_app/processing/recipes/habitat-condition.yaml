schema: eolab.model/v1
id: habitat-condition
version: "1.0.0"
title: Map ecosystem similarity to reference conditions
description: Use the Ecosystem Condition model to learn expected responses from environmental predictors at reference sites. Map how closely observed responses match those expectations, producing a 0–1 similarity map on a 500 m grid.
inputs:
  stack:
    type: habitat_stack
    label: Environmental predictors and observed responses
  area:
    type: summary_area
    label: Analysis area
  references:
    # Raster references use valid finite non-zero cells, including negative values.
    # Zero, NoData and nonfinite values are excluded. Align with nearest neighbor.
    type: habitat_references
    label: Reference sites
  habitat_mask:
    type: optional_raster
    label: Output mask (optional)
  preparation:
    type: raster_preparation
    label: Output grid
parameters: {}
steps:
  - id: calculate
    operation: habitat.condition.v1
    inputs:
      stack: {input: stack}
      area: {input: area}
      references: {input: references}
      habitat_mask: {input: habitat_mask}
      preparation: {input: preparation}
      settings:
        value:
          output_grid:
            crs: EPSG:6933
            pixel_size: [500, 500]
            origin: [0, 0]
          fold_count: 5
          sampling_block_size_meters: 25000
          validation_block_size_meters: 50000
          minimum_predictor_coverage: 0.8
          maximum_row_missing_fraction: 0.2
          spline_knot_count: 6
          minimum_response_coverage: 0.5
          ridge_alpha: 1.0
          samples_per_class_per_block: 100
          random_seed: 42
          tile_size_pixels: 128
          tile_origin: [0, 0]
          window_size_pixels: 256
          covariance_shrinkage: 0.1
    parameters: {}
outputs:
  reference_similarity:
    type: raster
    label: Reference similarity score (0–1)
    source: calculate.reference_similarity
    role: result
    presentation: map
    saveEligible: true
  diagnostics:
    type: raster
    label: Model diagnostics (ZIP)
    source: calculate.diagnostics
    role: intermediate
    presentation: download
    saveEligible: false
executionProfile: habitat-condition
