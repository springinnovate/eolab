schema: eolab.model/v1
id: temporal-period-map
version: "1.0.0"
title: Map a statistic per pixel for a time period
description: Calculate a statistic at each pixel across observations in the chosen period, such as maximum temperature during a month. Produces one statistic GeoTIFF and a second GeoTIFF counting valid observations per pixel. Total precipitation is also available for compatible precipitation-rate data.
inputs:
  source:
    type: temporal_interval
    label: Dataset and period
  area:
    type: summary_area
    label: Analysis area
  reduction:
    type: temporal_reduction
    label: Statistic across observations
parameters: {}
steps:
  - id: calculate
    operation: temporal.reduce.v1
    inputs:
      source: {input: source}
      area: {input: area}
      reduction: {input: reduction}
      precipitation:
        value:
          inputUnit: "kg m**-2 s**-1"
          outputUnit: mm
          # Total = sum(rate * interval seconds * factor).
          factor: 1
    parameters: {}
outputs:
  raster:
    type: raster
    label: Statistic per pixel for the chosen period
    source: calculate.raster
    role: result
    presentation: map
    saveEligible: true
  count:
    type: raster
    label: Valid observations per pixel
    source: calculate.count
    role: result
    presentation: map
    saveEligible: true
executionProfile: temporal-period-map
