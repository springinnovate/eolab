schema: eolab.model/v1
id: temporal-area-series
version: "1.0.0"
title: Export area statistics over time (CSV)
description: Calculate an area statistic for each observation of one raster variable, such as mean temperature within a watershed over time. Produces a CSV with one row per available observation and valid pixel counts. All selected polygons are treated as one combined area.
inputs:
  source:
    type: temporal_interval
    label: Dataset and period
  area:
    type: summary_area
    label: Analysis area
  statistic:
    type: area_statistic
    label: Statistic across pixels
parameters: {}
steps:
  - id: calculate
    operation: temporal.series.v1
    inputs:
      source: {input: source}
      area: {input: area}
      statistic: {input: statistic}
    parameters: {}
outputs:
  series:
    type: timeSeries
    label: Area statistics by observation (CSV)
    source: calculate.series
    role: result
    presentation: download
    saveEligible: false
executionProfile: temporal-area-series
