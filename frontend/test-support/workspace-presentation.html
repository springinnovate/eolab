<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workspace presentation checks</title>
</head>
<body>
  <h1>Workspace presentation checks</h1>
  <p>Serve the frontend with Vite, then open this page. These browser checks use the current application markup, CSS and presentation controllers; Node does not run them.</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    import L from "leaflet";
    import "leaflet/dist/leaflet.css";
    import { createSingleWorldMap } from "../src/map.js";
    import { TemporalScrubber } from "../src/raster/temporal-scrubber.js";
    import { OnMapLegend } from "../src/map-layers/on-map-legend.js";
    import { initializeCatalogPaneControls } from "../src/catalog-pane-controller.js";
    import { EomapLayoutController } from "../src/eomap-layout-controller.js";
    import { bindPanelFadeSettings } from "../src/panel-fade-settings.js";
    import { SavedMapViewLocalStorage } from "../src/saved-map-view/local-storage.js";
    import { MapInspectionController } from "../src/map-inspection-controller.js";
    import { MapLayerStackView } from "../src/map-layers/layer-stack-view.js";
    import { ModelsController } from "../src/models/controller.js";
    import { ModelsView } from "../src/models/view.js";
    import { ProcessingJobs } from "../src/processing/jobs.js";
    import { model, raster, area } from "./models/fixtures.js";
    import "../src/models/style.css";

    /** Fail this scenario when a user-visible condition is false.
     * @param {boolean} condition Expected outcome.
     * @param {string} message Description shown on failure.
     * @returns {void}
     * @throws {Error} If the outcome is false.
     */
    function check(condition, message) {
      if (!condition) throw new Error(message);
    }

    /** Check that drawing an observation keeps the timeline and Play button in place.
     * @returns {void}
     * @throws {Error} If clearing the loading message moves or resizes the widget.
     */
    function checkTimelineLoading() {
      const root = document.querySelector("#temporal-scrubber");
      const play = root.querySelector('[data-timeline="play"]');
      const dates = ["2000-01-02T01:00:00Z", "2000-01-02T02:00:00Z"];
      const timeline = new TemporalScrubber(root, {
        selectTime: async () => {}, selectMonth: async () => {}, prepare: async () => null,
      });
      try {
        timeline.setLayers([{key: "rain", visible: true, opacity: 1, timeline: {
          name: "Rainfall", variable: "rain", variableLabel: "Rain", times: dates, time: dates[0],
          months: ["2000-01"], month: "2000-01", loading: false, error: null, layerName: "first",
        }}]);
        const loading = root.getBoundingClientRect();
        const playTop = play.getBoundingClientRect().top;
        timeline.setMapStatus({phase: "complete"}, ["first"]);
        const drawn = root.getBoundingClientRect();
        check(drawn.height === loading.height && drawn.top === loading.top && play.getBoundingClientRect().top === playTop,
          "The timeline or its Play button moved when the raster finished loading");
      } finally { timeline.destroy(); }
    }

    /** Wait for layout and the existing sidebar transition to settle.
     * @returns {Promise<void>} Resolves after the transition and a paint.
     */
    function settleLayout() {
      return new Promise(resolve => setTimeout(() => requestAnimationFrame(() => resolve()), 300));
    }

    /** Check that a control is visible and can receive pointer input in this viewport.
     * @param {HTMLElement} element Control to inspect.
     * @returns {boolean} Whether its center is visible and unobstructed.
     */
    function isReachable(element) {
      const bounds = element.getBoundingClientRect();
      const x = bounds.left + bounds.width / 2;
      const y = bounds.top + bounds.height / 2;
      return bounds.width > 0 && bounds.height > 0 && x >= 0 && y >= 0 &&
        x < innerWidth && y < innerHeight && element.contains(document.elementFromPoint(x, y));
    }

    /** Verify overflow is contained in a scrollable region, rather than clipping its controls.
     * @param {HTMLElement} element Region with deliberately overflowing fixture content.
     * @param {string} name Region named in failure output.
     * @returns {void}
     * @throws {Error} If content cannot scroll within the viewport.
     */
    function checkScrollRegion(element, name) {
      check(["auto", "scroll"].includes(getComputedStyle(element).overflowY), `${name}: overflowing content cannot be scrolled by the user`);
      check(element.clientHeight > 0 && element.scrollHeight > element.clientHeight, `${name}: fixture must overflow a bounded region`);
      const bounds = element.getBoundingClientRect();
      check(bounds.height < innerHeight, `${name}: region expands beyond the viewport`);
      check(bounds.width > 0 && bounds.bottom > 0 && bounds.top < innerHeight && bounds.right > 0 && bounds.left < innerWidth,
        `${name}: scroll region is outside the viewport`);
      element.scrollTop = element.scrollHeight;
      check(element.scrollTop > 0, `${name}: scroll position did not change`);
    }

    /** Check map centering between the panels and keyboard access to the legend's hide and restore controls.
     * @param {MapInspectionController} inspection Mounted right panel with the Style tool selected.
     * @returns {void}
     * @throws {Error} If the map is off-center or a legend action loses focus or changes the active tool.
     */
    function checkLegendControls(inspection) {
      const sidebar = document.querySelector("#control-panel");
      const inspectionPanel = document.querySelector("#map-inspection");
      const map = createSingleWorldMap(L, {
        initialView: {latitude: 0, longitude: 0, zoom: 2},
        basemap: {url: L.Util.emptyImageUrl, attribution: "Test map"},
      }, undefined, [sidebar, inspectionPanel]);
      const command = document.querySelector("#toggle-map-legend");
      const menu = document.querySelector("#workspace-tool-actions");
      const legend = new OnMapLegend(L, map, {
        toggleButton: command, onRestoreRequested: () => inspection.showToolActions(),
        onChange() {}, onInclusion() {},
      });
      try {
        checkPanelFade(map.getContainer(), legend.root);
        if (innerWidth >= 1200) {
          map.fitBounds([[0, 0], [0, 0]], {maxZoom: 8, animate: false});
          const x = map.latLngToContainerPoint([0, 0]).x + map.getContainer().getBoundingClientRect().left;
          const freeLeft = sidebar.getBoundingClientRect().right;
          const freeRight = inspectionPanel.getBoundingClientRect().left;
          check(Math.abs(x - (freeLeft + freeRight) / 2) <= 2, "Zoom to layer missed the clear center between the open panels");
        }
        document.querySelector("#toggle-map-inspection-dock").click();
        const hide = legend.root.querySelector('button[aria-label="Hide map legend"]');
        check(hide.textContent === "×", "The legend has no local ×");
        hide.click();
        check(legend.root.hidden && menu.matches(":popover-open") &&
          command.textContent === "Show legend" && command === document.activeElement,
          "The legend's × did not hide it and focus its restore command");
        command.click();
        check(!legend.root.hidden && !menu.matches(":popover-open") && document.activeElement === legend.collapse,
          "Show legend did not restore the legend and its keyboard focus");
        check(document.querySelector("#map-tool-name").textContent === "Style" &&
          inspection.activeTool === "style", "The legend command replaced the foreground tool");
      } finally {
        legend.remove();
        map.remove();
      }
    }

    /** Finish the workspace's opacity transition and check what the user sees.
     * @param {Element} panel Workspace surface.
     * @param {string} opacity Expected CSS opacity after the configured delay and fade.
     * @returns {void}
     * @throws {Error} If the rendered opacity differs.
     */
    function checkPanelOpacity(panel, opacity) {
      for (const animation of panel.getAnimations()) {
        if (animation.transitionProperty === "opacity") animation.finish();
      }
      check(getComputedStyle(panel).opacity === opacity, `Expected ${panel.id || panel.className} opacity ${opacity}`);
    }

    /** Verify shared panel opacity, a cancelled exit and the map beneath the desktop sidebar.
     * @param {HTMLElement} map Live Leaflet map container.
     * @param {HTMLElement} legend Leaflet's interactive legend.
     * @returns {void}
     * @throws {Error} If a panel fades independently or the sidebar covers empty space.
     */
    function checkPanelFade(map, legend) {
      const sidebar = document.querySelector("#control-panel");
      const openers = document.querySelector("#map-tools-toolbar");
      const panels = [sidebar, openers, legend];
      const pointer = {bubbles: true, pointerType: "mouse", pointerId: 7};
      /** Finish only the panel opacity transitions to inspect their rendered endpoints.
       * @param {string} opacity Expected opacity of every panel.
       * @returns {void}
       */
      function checkOpacity(opacity) {
        for (const panel of panels) checkPanelOpacity(panel, opacity);
      }
      map.dispatchEvent(new PointerEvent("pointermove", pointer));
      checkOpacity("0.4");
      legend.dispatchEvent(new PointerEvent("pointerover", pointer));
      checkOpacity("1");
      legend.dispatchEvent(new PointerEvent("pointerout", {...pointer, relatedTarget: map}));
      check(getComputedStyle(legend).opacity === "1", "Leaving the legend skipped the exit delay");
      sidebar.dispatchEvent(new PointerEvent("pointerover", pointer));
      checkOpacity("1");
      sidebar.dispatchEvent(new PointerEvent("pointerout", {...pointer, relatedTarget: map}));
      checkOpacity("0.4");
      if (innerWidth >= 1200) {
        const canvas = map.getBoundingClientRect(), left = sidebar.getBoundingClientRect();
        check(canvas.left <= left.left && canvas.right >= openers.getBoundingClientRect().right,
          "The map does not extend beneath both panels");
        check(legend.getBoundingClientRect().left >= left.right, "The sidebar covers the map legend");
      }
    }

    /** Enable and tune idle panel fading, then check the saved controls and the panels' final opacity.
     * @returns {void}
     * @throws {Error} If a control, saved value, rendered opacity, or keyboard destination is wrong.
     */
    function checkFadeSettings() {
      const app = document.querySelector("#app");
      const panel = document.querySelector("#settings-panel");
      const chooser = document.querySelector("#map-tool-chooser");
      const toggle = panel.querySelector("#enable-panel-fading");
      const fields = [...panel.querySelectorAll('input[type="number"]')];
      const [enterDelay, fadeIn, exitDelay, fadeOut, opacity] = fields;
      const storage = new SavedMapViewLocalStorage(sessionStorage, "eolab.test.panel-fading");
      const defaults = "50,150,750,1000,40";
      storage.clear();
      // The production stylesheet can express the same default in seconds.
      app.style.setProperty("--panel-fade-in", "0.15s");
      let unbind = bindPanelFadeSettings(app, storage);
      /** Enter a value with the same input and change events as a completed edit.
       * @param {HTMLInputElement} input Slider or exact number to change.
       * @param {number} value Numeric input to exercise.
       * @return {void}
       */
      function edit(input, value) {
        input.value = String(value);
        input.dispatchEvent(new Event("input", {bubbles: true}));
        input.dispatchEvent(new Event("change", {bubbles: true}));
      }
      try {
        chooser.click();
        const menu = document.querySelector("#workspace-tool-actions");
        const command = menu.querySelector("#open-settings");
        check([...menu.querySelectorAll("button")].at(-1) === command, "Settings is not the last Tools command");
        command.click();
        check(document.activeElement === panel && panel.getClientRects().length && !menu.matches(":popover-open"),
          "Settings did not open in the dock with keyboard focus");
        check(!toggle.checked && fields.map(field => field.value).join(",") === defaults, "Unexpected fade defaults");
        toggle.click();
        edit(enterDelay, 0); edit(fadeIn, 0); edit(exitDelay, 3123); edit(fadeOut, 0);
        const slider = opacity.parentElement.querySelector('input[type="range"]');
        edit(slider, 63);
        check(opacity.value === "63" && exitDelay.parentElement.querySelector('input[type="range"]').value === "3123",
          "The slider and exact inputs disagree");
        const map = document.querySelector("#map");
        const pointer = {bubbles: true, pointerType: "mouse", pointerId: 28};
        map.dispatchEvent(new PointerEvent("pointermove", pointer));
        panel.dispatchEvent(new PointerEvent("pointerout", {...pointer, relatedTarget: map}));
        const sidebar = document.querySelector("#control-panel");
        check(getComputedStyle(sidebar).transitionDelay.split(", ").includes("3.123s"), "The map ignored the new exit delay");
        toggle.click();
        check(panel.querySelector("#panel-fade-options input:enabled") === null, "Turning fading off left a fade control enabled");
        checkPanelOpacity(sidebar, "1");
        unbind();
        unbind = bindPanelFadeSettings(app, storage);
        check(!toggle.checked && opacity.value === "63" && exitDelay.value === "3123", "Reopening lost the saved toggle or values");
        toggle.click(); edit(exitDelay, 0);
        checkPanelOpacity(sidebar, "0.63");
        checkPanelOpacity(document.querySelector("#map-inspection"), "0.63");
        edit(opacity, 101);
        opacity.dispatchEvent(new Event("blur"));
        check(opacity.value === "63", "An invalid edit replaced the last valid opacity");
        checkPanelOpacity(sidebar, "0.63");
        panel.querySelector("#restore-panel-fade-defaults").click();
        check(!toggle.checked && fields.map(field => field.value).join(",") === defaults && storage.read() === null,
          "Restoring defaults left a custom preference");
        document.querySelector("#close-settings").click();
        check(document.activeElement === document.querySelector('#map-inspection-tabs [aria-selected="true"]') && panel.hidden,
          "Closing Settings lost focus on the previous tool");
      } finally {
        unbind();
        storage.clear();
      }
    }

    /** Exercise both raster views as histogram results arrive in the shared dock.
     * @param {MapInspectionController} dock Mounted map inspection panel.
     * @returns {void}
     * @throws {Error} If a result changes the header text, layout, selected view or focus.
     */
    function checkHistogramResultNavigation(dock) {
      const header = document.querySelector(".map-inspection-dock-header");
      for (const [buttonId, open] of [
        ["open-raster-series-dock", () => dock.showRasterSeries()],
        ["map-click-histogram", () => dock.showHistogram()],
      ]) {
        open();
        dock.beginMapClick({ lat: -5, lng: -63 });
        const button = document.getElementById(buttonId);
        button.focus();
        const text = header.innerText;
        const height = header.offsetHeight;
        check(height > 0, "Analysis navigation must be visible before results arrive");
        for (const state of ["loading", "ready", "error"]) {
          dock.setClickResult("histogram", { state });
          check(header.innerText === text && header.offsetHeight === height,
            `Histogram ${state} changed the shared header with ${button.textContent} open`);
          check(button.getAttribute("aria-selected") === "true" && document.activeElement === button,
            `Histogram ${state} changed the selected view or moved keyboard focus`);
        }
      }
      const featureError = "The selected feature could not be read.";
      dock.setClickResult("feature", { state: "error", message: featureError });
      check(header.innerText.includes(featureError), "Feature inspection lost its own error feedback");
    }

    /** Inspect two map points, change tools during loading and check the dock's rendered opacity.
     * @param {MapInspectionController} dock Mounted map inspection panel.
     * @returns {void}
     * @throws {Error} If another panel stays opaque or a late result revives dismissed activity.
     */
    function checkMapClickFade(dock) {
      const panel = document.querySelector("#map-inspection");
      const sidebar = document.querySelector("#control-panel");
      const map = document.querySelector("#map");
      const pointer = {bubbles: true, pointerType: "mouse", pointerId: 7};
      dock.showHistogram();
      map.dispatchEvent(new PointerEvent("pointermove", pointer));
      for (const lat of [22, 24]) {
        dock.beginMapClick({lat, lng: 80});
        dock.setClickResult("histogram", {state: "loading"});
        dock.keepVisibleClickResultReadable();
        checkPanelOpacity(panel, "1");
        checkPanelOpacity(sidebar, "0.4");
        map.dispatchEvent(new PointerEvent("pointerdown", {...pointer, buttons: 1}));
        map.dispatchEvent(new PointerEvent("pointermove", {...pointer, buttons: 1}));
        map.dispatchEvent(new PointerEvent("pointerup", pointer));
        dock.setClickResult("histogram", {state: "ready"});
        checkPanelOpacity(panel, "1");
      }
      dock.beginMapClick({lat: 25, lng: 80});
      dock.setClickResult("histogram", {state: "loading"});
      dock.keepVisibleClickResultReadable();
      dock.showFeatureInspector();
      dock.setClickResult("histogram", {state: "ready"});
      checkPanelOpacity(panel, "0.4");
      check(dock.activeTool === "feature", "A completed histogram changed the foreground tool");
    }

    /** Check context, typography and keyboard navigation in the crowded map tab row.
     * @param {MapInspectionController} dock Mounted map inspection panel with the Style editor open.
     * @returns {Promise<void>} Resolves after choosing Style from All tabs and moving to Filter with Left Arrow.
     * @throws {Error} If the row wraps, hides the active view, loses context or changes focus on new results.
     */
    async function checkOpenMapViews(dock) {
      dock.showFilter("Survey plots");
      dock.showPlanning();
      dock.showAnnotations();
      dock.showHistogram();
      dock.setToolContext("models", { source: "Ecosystem Condition", scope: "" });
      dock.showModels();
      await settleLayout();
      const tabs = [...document.querySelectorAll("#map-inspection-tabs [role=tab]:not([hidden])")];
      const visible = tabs.filter(tab => tab.checkVisibility({ visibilityProperty: true }));
      check(new Set(visible.map(tab => tab.getBoundingClientRect().top)).size === 1,
        "Open right-panel views occupy more than one row");
      const models = document.querySelector("#map-inspection-tab-models");
      const histogram = document.querySelector("#map-click-histogram");
      const index = document.querySelector("#map-inspection-all-tabs");
      const menu = document.querySelector("#map-inspection-tab-menu");
      check(isReachable(models) && isReachable(histogram) && isReachable(index),
        "The active model, previous histogram or All tabs is out of reach");
      models.focus();
      dock.beginMapClick({ lat: 43, lng: -93 });
      dock.setClickResult("feature", { state: "ready", message: "One survey plot" });
      check(document.activeElement === models && models.getAttribute("aria-selected") === "true",
        "A background result moved focus away from model setup");
      index.click();
      await settleLayout();
      const choices = [...menu.querySelectorAll("button:not([hidden])")];
      check(menu.matches(":popover-open") && choices.length === tabs.length &&
        index.textContent.includes(`(${tabs.length})`), "All tabs count and available views disagree");
      const selected = menu.querySelector('[aria-checked="true"]');
      check(selected.innerText.includes("Ecosystem Condition") && document.activeElement === selected,
        "The menu lost the selected model's name or keyboard focus");
      const control = getComputedStyle(document.querySelector(".catalog-search input"));
      const supporting = getComputedStyle(document.querySelector(".catalog-search"));
      for (const label of [models, index, selected]) {
        const style = getComputedStyle(label);
        check(style.fontFamily === control.fontFamily && style.fontSize === control.fontSize,
          "Tab labels do not use the app control typography");
      }
      check(getComputedStyle(selected.querySelector("small")).fontSize === supporting.fontSize,
        "Tab context does not use the app supporting-text size");
      const feature = choices.find(choice => choice.innerText.includes("New results"));
      check(feature?.innerText.includes("Features"), "The unseen feature result is missing from All tabs");
      const editor = choices.find(choice => choice.innerText.includes("Land cover"));
      check(Boolean(editor), "The open Style editor lost its layer name");
      editor.click();
      const style = document.querySelector("#map-inspection-tab-style");
      check(document.activeElement === style && style.getAttribute("aria-selected") === "true" &&
        isReachable(style) && !menu.matches(":popover-open"), "Selecting Style did not return to its visible tab");
      document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      const filter = document.querySelector("#map-inspection-tab-filter");
      check(document.activeElement === filter && filter.getAttribute("aria-selected") === "true" &&
        document.querySelector("#vector-filter-panel").getAttribute("aria-hidden") === "false",
        "Left Arrow after choosing Style did not focus Filter and open its panel");
      dock.hideModels();
      dock.hideAnnotations();
      dock.hidePlanning();
      dock.hideFilter();
    }

    /** Check keyboard navigation and draft retention across Data tools pages and map views.
     * @param {MapInspectionController} dock Mounted map panel.
     * @returns {Promise<void>} Resolves after checking navigation and returning to the map view.
     * @throws {Error} If the two rows overlap, share selection, or lose access to a page.
     */
    async function checkDataToolTabs(dock) {
      const api = { discoverModels: async () => [model], listModelRuns: async () => ({ jobs: [], nextCursor: null }) };
      const jobs = new ProcessingJobs(api);
      const models = new ModelsController({
        api, jobs, view: new ModelsView(document), getContext: () => ({ rasters: [raster], area }),
        onOpen: () => dock.showModels(), onClose: () => dock.hideModels(), closeVectorFilter() {},
      });
      const unsubscribe = dock.subscribeActiveTool(tool => models.setActive(tool === "models"));
      const row = document.querySelector("#models-tabs").parentElement;
      try {
        document.querySelector("#open-models").click();
        await settleLayout();
        const upper = document.querySelector("#map-inspection-tab-bar");
        const mapTab = document.querySelector("#map-inspection-tab-models");
        const library = document.querySelector("#models-nav-library");
        const setup = document.querySelector("#models-nav-setup");
        const runs = document.querySelector("#models-nav-runs");
        check(Math.abs(upper.getBoundingClientRect().bottom - row.getBoundingClientRect().top) <= 1,
          "Data tools must start immediately below the map tabs");
        check(isReachable(library) && setup.disabled && isReachable(runs),
          "The library or Runs is unreachable, or Setup is enabled before choosing a tool");
        check(getComputedStyle(mapTab.parentElement).boxShadow === getComputedStyle(library).boxShadow,
          "The active map view and data page use different selection markers");
        document.querySelector("#models-library-items button").click();
        const name = document.querySelector("#models-setup input");
        name.value = "Watershed draft";
        name.dispatchEvent(new Event("input", { bubbles: true }));
        runs.click();
        runs.focus();
        row.style.inlineSize = `${library.offsetWidth + setup.offsetWidth + runs.offsetWidth - 1}px`;
        await settleLayout();
        check(getComputedStyle(library).visibility === "hidden", "Choose a tool must be in overflow before pressing Home");
        for (const [key, tab, pageId] of [
          ["Home", library, "models-library"],
          ["ArrowRight", setup, "models-setup"],
        ]) {
          document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
          check(document.activeElement === tab && tab.getAttribute("aria-selected") === "true" &&
            !document.getElementById(pageId).hidden,
            `${key} did not focus ${tab.textContent} and show its page`);
        }
        const index = document.querySelector("#models-all-tabs");
        check(isReachable(index) && isReachable(setup), "Data tools overflow hid the active Setup tab or its menu");
        index.click();
        await settleLayout();
        const menu = document.querySelector("#models-tab-menu");
        const choices = [...menu.querySelectorAll('[role="menuitemradio"]')];
        check(choices.map(choice => choice.querySelector("span").textContent).join(",") === "Choose a tool,Setup,Runs",
          "The page menu includes the wrong destinations");
        check(menu.querySelector('[aria-checked="true"] small').textContent === model.title,
          "The selected Setup entry lost its tool name");
        choices.at(-1).click();
        check(runs === document.activeElement && runs.getAttribute("aria-selected") === "true" &&
          isReachable(runs) && mapTab.getAttribute("aria-selected") === "true",
          "Opening Runs from overflow lost focus or changed the active map view");
        row.style.removeProperty("inline-size");
        await settleLayout();
        document.querySelector("#map-click-histogram").click();
        check(!isReachable(row), "Data tools navigation remains visible on another map view");
        mapTab.click();
        setup.click();
        check(isReachable(name) && name.value === "Watershed draft", "Returning to Setup lost the edited run name");
      } finally {
        row.style.removeProperty("inline-size");
        dock.hideModels();
        unsubscribe();
        models.destroy();
        jobs.destroy();
      }
    }

    /** Check panel collapse and restore, then close individual tools from their tabs.
     * @param {MapInspectionController} inspection Mounted map inspection panel.
     * @returns {Promise<void>} Resolves with the Style tab selected after its peers close.
     * @throws {Error} If a disclosure or tab close is unreachable or restores the wrong tool or focus.
     */
    async function checkPanelDisclosures(inspection) {
      const collapseLeft = document.querySelector("#collapse-panel");
      const expandLeft = document.querySelector("#open-panel");
      const collapseRight = document.querySelector("#toggle-map-inspection-dock");
      const expandRight = document.querySelector("#open-map-tools");
      const chooser = document.querySelector("#map-tool-chooser");
      const toolName = chooser.querySelector("#map-tool-name");
      check(toolName.textContent === "Choose a tool", "The empty panel has no named tool chooser");
      const leftButton = collapseLeft.getBoundingClientRect(), rightButton = collapseRight.getBoundingClientRect();
      check(leftButton.width === rightButton.width && leftButton.height === rightButton.height &&
        leftButton.width === leftButton.height && getComputedStyle(collapseRight, "::before").content !== "none" &&
        !collapseRight.textContent.includes("×"), "Map tools needs a distinct, reachable collapse control");
      collapseLeft.click();
      inspection.showStyle("Land cover");
      await settleLayout();
      check(toolName.textContent === "Style" && isReachable(chooser), "The active tool name cannot open the chooser");
      if (document.querySelector("#map-inspection-all-tabs").hidden) {
        check(isReachable(document.querySelector("#map-inspection-tab-style")) &&
          isReachable(document.querySelector("#close-layer-style")) && isReachable(document.querySelector("#map-click-histogram")),
          "A lone Style tab lost its close button or the Histograms shortcut");
      }
      check(isReachable(expandLeft) && isReachable(collapseRight), "One panel covers the other panel's button");
      inspection.showRasterClips();
      await settleLayout();
      const firstWord = document.createRange();
      firstWord.setStart(toolName.firstChild, 0);
      firstWord.setEnd(toolName.firstChild, "Download".length);
      check(firstWord.getClientRects().length === 1 && isReachable(expandLeft) && isReachable(chooser),
        "The tool title wraps mid-word or covers the left panel tab");
      const catalogTab = expandLeft.getBoundingClientRect();
      const sampleArea = document.querySelector("#raster-sampling-tool").getBoundingClientRect();
      check(catalogTab.right <= sampleArea.left || catalogTab.bottom <= sampleArea.top,
        "The sample area overlaps the left panel tab");
      inspection.hideRasterClips();
      collapseRight.click();
      await settleLayout();
      check(document.activeElement === expandRight, "Collapsing Map tools lost focus");
      check(chooser.getClientRects().length === 0, "The tool chooser still occupies map space");
      check(isReachable(expandLeft) && isReachable(expandRight), "A collapsed panel tab cannot be reached");
      const left = expandLeft.getBoundingClientRect();
      const right = expandRight.getBoundingClientRect();
      check(left.top === right.top && left.height === right.height && left.left === innerWidth - right.right,
        "Collapsed panel tabs differ in height or edge placement");
      expandLeft.click();
      await settleLayout();
      check(document.activeElement === collapseLeft && isReachable(collapseLeft), "The left panel lost keyboard focus");
      check(isReachable(expandRight), "Opening the left panel covered the Map tools tab");
      expandRight.click();
      await settleLayout();
      check(document.activeElement === collapseRight && isReachable(chooser), "The tool chooser did not return");
      check(isReachable(document.querySelector("#close-layer-style")) &&
        document.querySelector("#map-inspection-tab-style").getAttribute("aria-label") === "Style Land cover",
        "The style editor did not reopen on Land cover");

      const histogram = document.querySelector("#map-click-histogram");
      const closeHistogram = document.querySelector("#close-map-histogram");
      const settings = document.querySelector("#map-inspection-tab-settings");
      const closeSettings = document.querySelector("#close-settings");
      check(!isReachable(closeHistogram), "The unopened Histograms shortcut offers a close action");
      inspection.showHistogram();
      chooser.click();
      document.querySelector("#open-settings").click();
      await settleLayout();
      for (const [tab, close] of [[histogram, closeHistogram], [settings, closeSettings]]) {
        const label = tab.getBoundingClientRect(), button = close.getBoundingClientRect();
        check(isReachable(close) && Math.abs(button.left - label.right) <= 1 &&
          button.top === label.top && button.right <= tab.parentElement.getBoundingClientRect().right + 1,
          `The close button for ${tab.textContent} is outside its tab`);
      }
      const row = document.querySelector("#map-inspection-tabs");
      const stops = [...row.querySelectorAll("button")].filter(button =>
        button.tabIndex >= 0 && !button.disabled && isReachable(button));
      check(stops[0] === settings && stops[1] === closeSettings,
        "Keyboard entry must reach the selected Settings tab before any close button");
      closeSettings.focus();
      closeSettings.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      check(document.activeElement !== closeSettings && document.activeElement.classList.contains("tool-tab-close") &&
        settings.getAttribute("aria-selected") === "true", "ArrowLeft on × must reach a background close without switching tools");
      closeHistogram.click();
      check(!isReachable(closeHistogram) && settings.getAttribute("aria-selected") === "true" &&
        document.activeElement === settings, "Closing a background tab interrupted Settings");
      closeSettings.click();
      check(document.activeElement === document.querySelector("#map-inspection-tab-style") &&
        inspection.activeTool === "style", "Closing Settings lost the previously open Style tab");
    }

    /** Check where a long catalog filename begins and ends in a rendered Map contents row.
     * @returns {void}
     * @throws {Error} If the filename drops below the controls, overflows the row or leaves the pencil on its own line.
     */
    function checkMapLayerFilename() {
      const filename = "avoided_sdwa_health_costs_raster_projected_coged.tif";
      const view = new MapLayerStackView(document);
      view.render([{
        key: "health-costs", label: filename, item: { collection: "rasters", id: "health-costs" },
        datasetKind: "raster", isCustom: false, visible: true, opacity: 1, legend: null, error: null,
      }], null);
      const row = document.querySelector("#raster-layer-list > li");
      const checkbox = row.querySelector('[data-layer-action="visibility"]');
      const labels = [...checkbox.labels];
      check(labels.map(label => label.textContent).join("") === filename, "The visibility label lost part of the filename");
      const lines = labels.flatMap(label => {
        const range = document.createRange();
        range.selectNodeContents(label);
        return [...range.getClientRects()];
      });
      const firstLine = lines[0];
      const lastLine = lines.at(-1);
      const checkboxBounds = checkbox.getBoundingClientRect();
      check(firstLine && firstLine.left >= checkboxBounds.right &&
        firstLine.top < checkboxBounds.bottom && firstLine.bottom > checkboxBounds.top,
        "The filename must start beside the visibility checkbox");
      const rowBounds = row.getBoundingClientRect();
      check(lines.every(line => line.left >= rowBounds.left && line.right <= rowBounds.right), "The filename overflows its card");
      const renameBounds = row.querySelector('[data-layer-action="rename"]').getBoundingClientRect();
      check(lastLine.top < renameBounds.bottom && lastLine.bottom > renameBounds.top, "Rename must sit on the last line of the filename");
      view.unbind();
    }

    /** Exercise workspace scrolling, panel disclosures and result navigation at this viewport size.
     * @returns {Promise<void>} Resolves after the current viewport passes.
     * @throws {Error} If markup cannot load or a presentation outcome fails.
     */
    async function checkWorkspace() {
      const response = await fetch("/index.html");
      check(response.ok, "Application markup could not be loaded");
      const markup = new DOMParser().parseFromString(await response.text(), "text/html");
      markup.querySelectorAll("script").forEach(script => script.remove());
      document.body.replaceChildren(...markup.body.childNodes);
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "/src/style.css";
      await new Promise((resolve, reject) => {
        stylesheet.onload = resolve;
        stylesheet.onerror = () => reject(new Error("Application CSS could not be loaded"));
        document.head.append(stylesheet);
      });
      checkTimelineLoading();
      const layout = new EomapLayoutController({
        documentContext: document,
        /** No map renderer is mounted in this presentation fixture. @returns {void} */
        invalidateMapSize() {},
      });
      const catalog = initializeCatalogPaneControls(document, () => layout.notifyLayoutChange());
      const results = document.querySelector("#catalog-results");
      for (let index = 0; index < 80; index++) {
        const row = document.createElement("p");
        const button = document.createElement("button");
        button.textContent = `Observation ${index + 1}: More details`;
        button.onclick = () => catalog.showInspector({ moveFocus: true, returnFocusTarget: button });
        row.append(button);
        results.append(row);
      }
      const resultsScroll = document.querySelector("#catalog-results-scroll");
      await settleLayout();
      const search = document.querySelector("#catalog-search");
      checkScrollRegion(resultsScroll, "Catalog results");
      check(isReachable(search), "Catalog search disappears when results scroll");
      const lastResult = results.lastElementChild.firstElementChild;
      lastResult.scrollIntoView({ block: "nearest" });
      check(isReachable(lastResult), "Last Catalog result cannot be reached");
      lastResult.click();
      await settleLayout();
      check(document.activeElement.id === "catalog-inspector-heading", "Opening details does not focus its heading");
      const closeDetails = document.querySelector("#close-catalog-item-details");
      check(isReachable(closeDetails), "Details close control cannot be reached");
      closeDetails.click();
      await settleLayout();
      check(document.activeElement === lastResult && isReachable(lastResult), "Closing details does not return to the chosen result");

      layout.showWorkspace("map-layers");
      const mapContents = document.querySelector("#eomap-map-layers-body");
      for (let index = 0; index < 80; index++) {
        const row = document.createElement("p");
        row.textContent = `Map content ${index + 1}`;
        mapContents.append(row);
      }
      await settleLayout();
      checkMapLayerFilename();
      const catalogPosition = resultsScroll.scrollTop;
      checkScrollRegion(mapContents, "Map contents");
      check(resultsScroll.scrollTop === catalogPosition, "Scrolling Map contents moves Catalog results");
      check(isReachable(document.querySelector("#toggle-map-layers")), "Map contents disclosure is clipped");
      document.querySelector("#toggle-map-layers").click();
      check(mapContents.getClientRects().length === 0, "Collapsed Map contents still occupies visible space");

      document.querySelector("#toggle-operational-status").click();
      const diagnostics = document.querySelector("#system-state");
      diagnostics.open = true;
      const locations = document.querySelector("#scan-locations");
      for (let index = 0; index < 80; index++) {
        const row = document.createElement("li");
        row.textContent = `Configured data directory ${index + 1}`;
        locations.append(row);
      }
      await settleLayout();
      checkScrollRegion(diagnostics.querySelector(".system-state-details-body"), "Catalog diagnostics");
      check(isReachable(diagnostics.querySelector("summary")), "Diagnostic disclosure cannot be closed");
      const lastLocation = locations.lastElementChild;
      lastLocation.scrollIntoView({ block: "nearest" });
      check(isReachable(lastLocation), "Last diagnostic location cannot be reached");
      const inspection = new MapInspectionController({
        onLayoutChange: state => layout.setInspectionLayout(state),
      });
      layout.registerPanelActivitySource(document.querySelector("#map-inspection"),
        listener => inspection.subscribeClickResultActivity(listener));
      await checkPanelDisclosures(inspection);
      await checkDataToolTabs(inspection);
      await checkOpenMapViews(inspection);
      checkLegendControls(inspection);
      checkFadeSettings();
      checkHistogramResultNavigation(inspection);
      checkMapClickFade(inspection);
      inspection.destroy();
      layout.destroy();
    }

    if (new URLSearchParams(location.search).has("frame")) {
      try {
        await checkWorkspace();
        parent.postMessage({ workspacePresentation: "passed" }, location.origin);
      } catch (error) {
        parent.postMessage({ workspacePresentation: "failed", message: error.message }, location.origin);
      }
    } else {
      const results = document.querySelector("#results");
      results.textContent = "";
      for (const [width, height] of [[1280, 720], [390, 844]]) {
        const frame = document.createElement("iframe");
        frame.width = width;
        frame.height = height;
        frame.title = `Workspace at ${width} by ${height}`;
        const result = new Promise(resolve => {
          const timeout = setTimeout(() => {
            removeEventListener("message", receive);
            resolve({ workspacePresentation: "failed", message: "Scenario did not finish; inspect the browser console" });
          }, 15000);
          /** Receive only this fixture frame's completion.
           * @param {MessageEvent} event Same-origin scenario result.
           * @returns {void}
           */
          function receive(event) {
            if (event.source !== frame.contentWindow || event.origin !== location.origin || !event.data.workspacePresentation) return;
            clearTimeout(timeout);
            removeEventListener("message", receive);
            resolve(event.data);
          }
          addEventListener("message", receive);
        });
        frame.src = `${location.pathname}?frame`;
        document.body.append(frame);
        const outcome = await result;
        results.textContent += `${width}x${height}: ${outcome.workspacePresentation}${outcome.message ? ` - ${outcome.message}` : ""}\n`;
      }
    }
  </script>
</body>
</html>
