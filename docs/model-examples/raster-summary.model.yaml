# Installed native-grid raster summary recipe.
schema: eolab.model/v1
id: raster-summary
version: "1.1.0"
title: Calculate a raster statistic within an area
description: Calculate a mean, sum, minimum, maximum, or another summary value from raster pixels within an area you choose—for example, average elevation within a watershed. All selected polygons are treated as one combined area.
inputs:
  raster:
    type: raster
    label: Raster
  area:
    type: summary_area
    label: Analysis area
parameters:
  summary:
    type: summary_expression
    label: Statistic formula
    alias: a
    grammar: eolab.scalar/v1
    default: "sum(a)"
steps:
  - id: calculate
    operation: raster.aggregate.v1
    inputs:
      raster: {input: raster}
      area: {input: area}
    parameters:
      expression: {parameter: summary}
outputs:
  statistics:
    label: Raster statistic for the chosen area
    source: calculate.statistics
    role: result
    presentation: table
    saveEligible: true
executionProfile: raster-summary
